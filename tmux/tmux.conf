set -g default-terminal "screen-256color"
set -s escape-time 0
set -g history-limit 5000
set -g display-time 4000
set -g status-interval 5
set -g focus-events on
set -g renumber-windows on
set -g base-index 1
set -g mouse on

bind R source-file ~/.config/tmux/tmux.conf
bind R move-window -r

unbind C-b
bind-key C-a send-prefix
set -g prefix C-a

set -g status-bg black
set -g status-fg white

set -g @claude_glyph '🮉'
set -g @claude_marks '#{P:#{?#{==:#{@claude_state},working},#[fg=yellow]#{@claude_glyph},}#{?#{==:#{@claude_state},blocked},#[fg=red]#{@claude_glyph},}#{?#{==:#{@claude_state},done},#[fg=green]#{@claude_glyph},}#{?#{==:#{@claude_state},idle},#[fg=brightblack]#{@claude_glyph},}}#[default]'
set -g window-status-format '#I:#W#{p1:window_flags}#{E:@claude_marks}'
set -g window-status-current-format '#I:#W#{p1:window_flags}#{E:@claude_marks}'
set -g window-status-separator '   '

set-hook -g window-pane-changed 'if -F "#{==:#{@claude_state},done}" "set -p @claude_state idle"'
set-hook -g session-window-changed 'if -F "#{==:#{@claude_state},done}" "set -p @claude_state idle"'
set-hook -g client-session-changed 'if -F "#{==:#{@claude_state},done}" "set -p @claude_state idle"'
set-hook -g pane-focus-in 'if -F "#{==:#{@claude_state},done}" "set -p @claude_state idle"'

set-window-option -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

bind -r ^ last-window
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

# Allows you to keep the prefix key held while you type the command key
bind C-p previous-window
bind C-n next-window

bind-key -r f run-shell "tmux neww ~/.config/tmux/tmux-sessionizer"
